services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: gom
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - gom-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__GomDatabase: "Host=postgres;Port=5432;Database=gom;Username=postgres;Password=devpassword"
      Jwt__Key: "this-is-a-dev-only-secret-key-change-me-in-production-32chars+"
      Jwt__Issuer: "GroupOrderManager"
      Jwt__Audience: "GroupOrderManager"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  gom-postgres-data:
